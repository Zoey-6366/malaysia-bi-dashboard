let state={page:'overview',period:'all'};const rm=n=>'RM '+Number(n||0).toLocaleString('en-MY',{maximumFractionDigits:0});const pct=(a,b)=>b?((a/b)*100).toFixed(1)+'%':'—';
function f(){return state.period==='all'?{sales:D.totals.pnlSales,gp:D.totals.grossProfit,ex:D.totals.expenses,np:D.totals.netProfit}:{sales:D.finance[state.period].sales,gp:D.finance[state.period].gross_profit,ex:D.finance[state.period].expenses,np:D.finance[state.period].net_profit}}
function card(a,b,c,d=''){return `<article class="kpi"><span>${a}</span><strong>${b}</strong><small>${c}${d?' · '+d:''}</small></article>`}function cards(html){return `<div class="kpis">${html}</div>`}function panel(title,body,tag='真实数据'){return `<section class="panel"><div class="panel-head"><h2>${title}</h2><span class="tag">${tag}</span></div>${body}</section>`}function bars(rows,type='teal'){let max=Math.max(...rows.map(x=>x.value),1);return `<div class="bars">${rows.map(x=>`<div class="bar-row"><span title="${x.name}">${x.name}</span><div class="track"><div class="bar ${type}" style="width:${x.value/max*100}%"></div></div><b class="num">${rm(x.value)}</b></div>`).join('')}</div>`}function table(rows,cols){return `<table class="table"><thead><tr>${cols.map(x=>`<th>${x[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(x=>`<td>${x[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}function missing(name,source){return panel(name,`<div class="empty"><b>待接入数据源</b><p>${source}</p><small>蓝图页面已保留；接入明细后自动填充计算。</small></div>`,'建设中')}
function overview(){let x=f(),margin=pct(x.np,x.sales);return `${cards([card('损益表销售额',rm(x.sales),'财务口径'),card('净利润',rm(x.np),`净利率 ${margin}`),card('有效 ERP 应收',rm(D.totals.erpReceivable),`${D.totals.validOrders} 笔非取消订单`),card('缺货记录',D.totals.stockouts+' 条',D.totals.stockoutQty+' 件反馈')].join(''))}<div class="grid">${panel('销售、利润与费用（月度）',bars(D.months.map(m=>({name:m,value:D.finance[m].net_profit})),'teal'),'财务真实')}${panel('经营异常行动清单',`<div class="note"><b>需优先对账：</b>损益表销售 ${rm(D.totals.pnlSales)} 与发票明细 ${rm(D.totals.invoiceSales)} 相差 ${rm(D.totals.reconGap)}。在确认折让、税额、跨期或未入库发票前，不建议把两者混用为同一销售指标。</div><p>缺货 ${D.totals.stockouts} 条，涉及 ${D.stockoutByState.length} 个州属；应优先处理高需求颜色与高价值门店。</p>`,'行动')}${panel('州属有效应收',bars(D.orderByState),'ERP订单')}${panel('前十大费用',bars(D.expenseRows,'amber'),'损益表')}</div>`}
function sales(){return `${cards([card('发票销售额',rm(D.totals.invoiceSales),`${D.totals.invoices} 张发票`),card('开票数量',D.totals.invoiceQty,'销售明细口径'),card('有效 ERP 应收',rm(D.totals.erpReceivable),`${D.totals.validOrders} 笔`),card('ERP 实付',rm(D.totals.erpPaid),`实收率 ${pct(D.totals.erpPaid,D.totals.erpReceivable)}`)].join(''))}<div class="grid">${panel('按销售人员的发票销售',bars(D.salesBySeller),'发票明细')}${panel('Top 客户',bars(D.salesByCustomer),'发票明细')}${panel('订单状态结构',bars(D.orderStatus,'amber'),'ERP订单')}${missing('复购队列与流失门店','需补充完整历史订单、统一门店 ID、退款/退货完成时间与客户分层规则。')}</div>`}

  const targetTracking=()=>{const month='2026-08',full=Number((D.monthlyTargets||{})[month]||0),ms='2026-08-01',me='2026-08-31',start=state.start>ms?state.start:ms,end=state.end<me?state.end:me;if(!full||start>end)return {target:0,actual:0,days:0,scope:'所选日期未落在 2026 年 8 月'};const days=(new Date(end+'T12:00:00')-new Date(start+'T12:00:00'))/86400000+1,target=full*days/31,actual=sum(D.orders.filter(x=>x.date>=start&&x.date<=end&&x.status!=='订单取消'),x=>x.receivable);return {target,actual,days,scope:`2026-08-${start.slice(-2)} 至 2026-08-${end.slice(-2)}`}};

  function supplyV4(){const s=stock(),one=n=>Number(n||0).toLocaleString('en-MY',{maximumFractionDigits:1}),color=D.inventory.families.find(x=>x.name==='改色膜')||{},ppf=D.inventory.families.find(x=>x.name==='隐形车衣')||{},t=D.transit,shipRows=[{n:'改色整支',q:t.colorReady,u:'支',stage:'已备未发'},{n:'车衣整支（含 TPU-M 7.5 手工追加 50 支）',q:t.ppfReady+t.ppfManualM75,u:'支',stage:'计划发船'},{n:'灯膜 5 箱',q:t.lampReady,u:'支',stage:'已备未发'},{n:'零裁（车衣+改色）',q:t.cutReady,u:'支',stage:'已备未发'},{n:'窗膜',q:t.windowRolls,u:'卷',stage:'在途订单待收货'},{n:'改色整支',q:t.colorPreparing,u:'支',stage:'备货中'}];return `${cards([card('改色膜现货',one(color.equivalentRolls)+' 支当量',`${one(color.meters)} 米 · 16 米/支`),card('车衣现货',one(ppf.equivalentRolls)+' 支当量',`${one(ppf.meters)} 米 · 15 米/支`),card('8/15 计划车衣发船',num(t.ppfReady+t.ppfManualM75)+' 支',`含 TPU-M 7.5 追加 ${t.ppfManualM75} 支`),card('8/15 计划改色发船',num(t.colorReady)+' 支','已备未发')].join(''))}<div class="grid">${panel('马来西亚仓现货（整支当量）',table((D.inventory.families||[]).map(x=>({n:x.name,m:x.meters,e:x.equivalentRolls,w:x.wholeRolls,c:x.cutMeters,u:x.unitMeters})),[['品类',r=>r.n],['库存长度',r=>one(r.m)+' 米'],['整支当量',r=>one(r.e)+' 支'],['完整整支',r=>num(r.w)+' 支'],['零裁长度',r=>one(r.c)+' 米']]),'库存快照 2026-08-11')}${panel(`计划发运 / 在途（目标 ${t.shipDate} 发船）`,table(shipRows,[['类别',r=>r.n],['数量',r=>num(r.q)+' '+r.u],['状态',r=>r.stage]]),'备货汇总主口径')}${panel('供货风险与对账提醒',`<div class="note"><b>发运节点：</b>计划赶 ${t.shipDate.slice(5).replace('-', ' 月 ')} 日发船；目前是计划/备货状态，非已开船确认。</div><p><b>对账差异：</b>${t.reconciliation}</p><p>库存已按改色膜 16 米/支、车衣 15 米/支统一换算；零裁只计入整支当量，不应当被当作完整整支可售。</p>`,'需确认')}${panel('缺货颜色优先级',list(group(s,x=>x.color,x=>x.qty),'risk'),'缺货明细')}${missing('安全库存、补货点与 ETA 预警','需补充 SKU 日库存、锁定/可售库存、在途柜号、实际开船/到港 ETA、采购订单、最低安全库存和历史日均销量。')}</div>`}
  function planningV5(){const m='2026-08',ms='2026-08-01',cutoff=(D.latestDate<'2026-08-31'?D.latestDate:'2026-08-31'),orders=D.orders.filter(x=>x.date>=ms&&x.date<=cutoff),target=Number((D.monthlyTargets||{})[m]||0),actual=sum(orders,x=>x.receivable),paid=sum(orders,x=>x.paid),gap=Math.max(target-actual,0),elapsed=(new Date(cutoff+'T12:00:00')-new Date(ms+'T12:00:00'))/86400000+1,remain=Math.max(31-elapsed,0),need=remain?gap/remain:gap,avg=actual/Math.max(elapsed,1),progress=Math.min(100,target?actual/target*100:0),today=orders.filter(x=>x.date===cutoff),first={};D.orders.forEach(x=>{if(x.store&&(!first[x.store]||x.date<first[x.store]))first[x.store]=x.date});const firstToday=today.filter(x=>first[x.store]===cutoff).length,repeatToday=today.length-firstToday,unpaid=sum(today,x=>Math.max(x.receivable-x.paid,0)),tile=(title,value,detail,kind='')=>`<article class="target-tile ${kind}"><span>${title}</span><b>${value}</b><small>${detail}</small></article>`;return `<div class="target-hero"><section class="target-main"><span class="target-caption">距 8 月目标还差</span><div class="target-gap">${fmt(gap)}</div><div class="target-progress"><i style="width:${progress}%"></i></div><div class="target-foot"><span>已完成 ${fmt(actual)}</span><span>目标 ${fmt(target)} · ${progress.toFixed(1)}%</span></div></section><section class="target-pace"><span class="target-caption">剩余日均需完成</span><strong>${fmt(need)}</strong><small>剩余 ${remain} 天 · 当前日均 ${fmt(avg)} · 需达到 ${(need/Math.max(avg,1)).toFixed(2)}×</small></section></div><div class="target-grid">${tile('8 月固定目标',fmt(target),'2026 年 8 月冲刺目标','blue')}${tile('8 月有效订单应收',fmt(actual),`数据截至 ${cutoff}`,'green')}${tile('8 月有效订单数量',num(orders.length)+' 单','取消、已退款、退货完成已剔除','purple')}${tile('8 月已实付金额',fmt(paid),`收款率 ${percent(paid,actual)}`,'green')}${tile('8 月待收金额',fmt(Math.max(actual-paid,0)),'有效订单应收 − 已实付','orange')}</div><div class="target-today"><p class="eyebrow">TODAY'S ORDERS</p><h2>${cutoff} 当日订单明细</h2><div class="target-grid">${tile('当日有效订单',num(today.length)+' 单','当日有效订单数','blue')}${tile('当日首单订单',num(firstToday)+' 单','以当前订单导出历史识别','green')}${tile('当日重复订单',num(repeatToday)+' 单','导出区间内已有历史订单','purple')}${tile('当日待收金额',fmt(unpaid),'当日有效订单应收 − 实付','red')}${tile('当日应收金额',fmt(sum(today,x=>x.receivable)),'当日有效订单应收合计','orange')}${tile('当日实收金额',fmt(sum(today,x=>x.paid)),'当日订单实付合计','green')}</div></div>${panel('目标口径说明',`<div class="note"><b>固定月目标：RM 300,000</b><p>本页固定追踪 2026 年 8 月，数据截止 ${cutoff}。全月目标不随全局日期筛选改变；经营总览中的日期筛选仅影响对应时间范围的经营指标。首单/重复订单目前只基于导出的历史订单识别，完整历史订单接入后将升级为真实客户生命周期口径。</p></div>`,'管理口径')}${missing('月末预测、区域/人员目标与复盘行动','需接入区域、人员、新店、复购、回款、毛利目标；并补充商机概率、责任人、截止日期、处理状态及复盘结果。')}`}
  function finance2(){const x=financeSummary();const fullMonth=state.start.endsWith('-01')&&state.end===new Date(Number(state.end.slice(0,4)),Number(state.end.slice(5,7)),0).toISOString().slice(0,10);return `${cards([card('期末未回款',fmt(D.totals.receivableOutstanding),`截至 ${D.receivableAsAt} · 时点快照`),card('逾期未回款',fmt(D.totals.receivableOverdue),'账龄大于 0 天'),card('净销售额',fmt(x.sales),'损益表月度口径'),card('净利润',fmt(x.np),`净利率 ${percent(x.np,x.sales)}`)].join(''))}<div class="grid">${panel('财务期间说明',`<div class="note"><b>${x.months.join('、')||'暂无财务期间'} 会计月累计</b><p>${fullMonth?'当前选择为完整自然月。':'当前为日/自定义范围；损益表未提供日级凭证，因此此处显示范围覆盖月份的会计月累计，不代表当日损益。'} 应收账龄为 ${D.receivableAsAt} 时点快照，不随日期筛选变化。</p></div>`,'财务辅助口径')}${panel('应收账龄',list(D.receivableAging),'客户应收未回款清单')}${panel('利润瀑布',table([{n:'销售额',v:x.sales},{n:'毛利额',v:x.gp},{n:'经营费用',v:-x.ex},{n:'净利润',v:x.np}],[['项目',r=>r.n],['金额',r=>fmt(r.v)]]),'损益表')}${panel('费用结构（累计）',list(D.expenseRows,'amber'),'损益表')}${missing('13 周现金预测','仍需接入应收核销日期、银行流水、付款计划、采购付款与现金余额。')}</div>`}
  Object.assign(renderers,{overview:overviewV4,funnel:funnelV3,quality:qualityV3,sales:salesV3,region:regionV3,efficiency:efficiencyV3,demand:demand2,supply:supplyV4,alerts:alertsV3,people:people2,finance:finance2,planning:planningV5,governance:governanceV3});
  function setRange(kind){const d=new Date(latest+'T12:00:00'), iso=x=>x.toISOString().slice(0,10);let a=latest,b=latest;if(kind==='week'){d.setDate(d.getDate()-6);a=iso(d)}if(kind==='month'){a=latest.slice(0,8)+'01'}if(kind==='lastmonth'){const y=d.getFullYear(),m=d.getMonth();a=iso(new Date(y,m-1,1));b=iso(new Date(y,m,0))}if(kind==='all'){a=earliest;b=latest}Object.assign(state,{start:a,end:b,preset:kind});sync()}
  function sync(){q('#dateStart').value=state.start;q('#dateEnd').value=state.end;qAll('.quick-range button').forEach(b=>b.classList.toggle('active',b.dataset.range===state.preset));q('#filterNote').textContent=`当前筛选：${state.start} 至 ${state.end}；经营总览以订单数据为主，新增拿货门店按创建时间联动；财务损益按会计月、应收为时点快照。`;render()}
  const qAll=s=>document.querySelectorAll(s);qAll('.quick-range button').forEach(b=>b.onclick=()=>setRange(b.dataset.range));q('#dateStart').onchange=e=>{state.start=e.target.value||earliest;if(state.start>state.end)state.end=state.start;state.preset='custom';sync()};q('#dateEnd').onchange=e=>{state.end=e.target.value||latest;if(state.end<state.start)state.start=state.end;state.preset='custom';sync()};document.addEventListener('click',e=>{const target=e.target.closest('[data-map-state]');if(!target)return;const selected=target.dataset.mapState;state.mapState=state.mapState===selected?'':selected;render()});sync();
})();
